# pairs.conf — vault mirror pairs (Ordo lineage)
# Format: name|path1|path2|enabled|extra_flags
#   path1 = local folder, path2 = local folder OR rclone remote:path
#   enabled = on|off   (off = ignored by `run`)
# RULES: never point a pair at the vault root itself (GitHub layer owns it);
#        .git never crosses a pair boundary (filters.txt guards);
#        first enable = `bash _sync/pairs-sync.sh init <name>` — human run.
#
# --- examples (edit, set enabled=on, then init) ---
